name: build-and-deploy

# Builds the static site from the committed data and deploys it to GitHub Pages.
# The LLM pipeline never runs here: steps 02 and 03 are served from the committed
# cache and the committed intermediate outputs (LLM_CACHE_ONLY=1).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # no actions/configure-pages here: the base path comes from SITE_BASE and the Pages site
      # is enabled by scripts/setup-github.sh, so the build job only needs read access
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build data and site (no LLM calls)
        env:
          LLM_CACHE_ONLY: "1"
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          # repository variable; leave it unset to build without analytics
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
